<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM - Ruta Crítica e Intercambios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root{--bg:#000;--surface:#1c1c1e;--surface-2:#252528;--surface-3:#3a3a3c;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);--border-hover:rgba(255,255,255,.22);--text:rgba(255,255,255,.92);--text-2:rgba(255,255,255,.52);--text-3:rgba(255,255,255,.28);--accent:#0a84ff;--accent-hover:#409cff;--green:#30d158;--green-hover:#28b84c;--red:#ff453a;--red-hover:#d93025;--yellow:#ffd60a;--graph-bg:#141414;--highlight-bg:rgba(10,132,255,.06);--highlight-border:rgba(10,132,255,.25);--warning-bg:rgba(255,214,10,.08);--warning-border:rgba(255,214,10,.25);--table-header:#1c1c1e}
        [data-theme="light"]{--bg:#f4f4f9;--surface:#fff;--surface-2:#f0f0f3;--surface-3:#e2e2e5;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.14);--border-hover:rgba(0,0,0,.22);--text:#1c1c1e;--text-2:rgba(0,0,0,.52);--text-3:rgba(0,0,0,.28);--accent:#0a84ff;--accent-hover:#006ed4;--green:#34c759;--green-hover:#28a745;--red:#ff3b30;--red-hover:#d32f2f;--yellow:#ff9f0a;--graph-bg:#fafafa;--highlight-bg:#f0f8ff;--highlight-border:#0a84ff;--warning-bg:#fff3cd;--warning-border:#ffeeba;--table-header:#f0f0f3}

        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1.5rem;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
        .page{width:100%;max-width:1400px;margin:0 auto}
        .nav-back{display:inline-flex;align-items:center;gap:.4rem;color:var(--accent);font-size:.82rem;font-weight:500;text-decoration:none;padding:.4rem .85rem;border-radius:999px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.18);transition:background .18s;margin-bottom:1.25rem}

        #main-flex.full-log-mode{flex-direction:column}

                <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;background:var(--surface-3);padding:10px;border-radius:8px;">

                </div>
                <div style="text-align:right"><button id="btn-add-act" class="success">Agregar Actividad</button></div>
            </div>

            <div class="table-container">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th>Actividad</th>
                            <th>Descripción</th>
                            <th>Predec.</th>
                            <th>T. Normal (τ)</th>
                            <th>T. Acel (τ')</th>

                            <th>C. Acel (C')</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="panel" style="margin-top:16px">
                <div class="form-group" style="margin-bottom:12px">
                    <label>Modo de Resolución:</label>
                    <select id="solve-mode" style="padding:8px;width:100%">
                        <option value="cpm">Solo Ruta Crítica (CPM)</option>
                        <option value="crash">Intercambios Tiempo-Costo (Crash)</option>
                    </select>
                </div>
                <button id="btn-solve" class="success" style="width:100%;font-size:.92rem;padding:.75rem">¡Calcular Proyecto!</button>
            </div>
        </div>

        <div id="solver-panel" class="panel solver-section" style="flex:1;min-width:0;width:100%">
            <button id="btn-back-edit" style="margin-bottom:12px">← Volver a Editar</button>
            <h3>Resultados</h3>
            <div class="step-controls"><button id="btn-prev-step" disabled>Anterior</button><strong id="step-info">Paso 0 / 0</strong><button id="btn-next-step">Siguiente</button></div>
            <button id="btn-full-log" class="success" style="width:100%;margin-bottom:12px">Ver Todo 📄</button>
            <div id="step-description"></div>
        </div>
    </div>
    <div style="margin-top:20px;width:100%">
        <h2>Grafo del Proyecto (AON)</h2>
        <div id="graph-container"></div>
    </div>
</div>

<script>
// ═══ CPM SOLVER ═══
class CPMSolver {
    constructor(activities, mode = 'cpm') {
        // activities: array of {id, desc, pred:[], tn, ta, cn, ca}
        this.activities = JSON.parse(JSON.stringify(activities));
        this.mode = mode;
        this.steps = [];
        this.graphHistory = [];
    }

    solve() {
        if (this.activities.length === 0) return [];
        this.steps = []; this.graphHistory = [];

        // Build adjacency list
        let adj = {}, revAdj = {}, nodes = {};
        let allIds = this.activities.map(a => a.id);
        
        for (let a of this.activities) {
            adj[a.id] = [];
            revAdj[a.id] = a.pred.filter(p => allIds.includes(p));
            nodes[a.id] = { ...a, duration: a.tn };
        }
        for (let id in revAdj) {
            for (let p of revAdj[id]) {
                if (adj[p]) adj[p].push(id);
            }
        }

        // Add INICIO and FIN dummy nodes
        let starts = allIds.filter(id => revAdj[id].length === 0);
        let ends = allIds.filter(id => adj[id].length === 0);
        
        nodes['INICIO'] = { id: 'INICIO', duration: 0, tn: 0, ta: 0, cn: 0, ca: 0 };
        nodes['FIN'] = { id: 'FIN', duration: 0, tn: 0, ta: 0, cn: 0, ca: 0 };
        adj['INICIO'] = starts;
        revAdj['INICIO'] = [];
        adj['FIN'] = [];
        revAdj['FIN'] = ends;
        for (let s of starts) revAdj[s].push('INICIO');
        for (let e of ends) adj[e].push('FIN');

        let allNodes = ['INICIO', ...allIds, 'FIN'];

        // Topological Sort
        let topo = [], visited = new Set(), tempMark = new Set(), hasCycle = false;
        const visit = (n) => {
            if (tempMark.has(n)) hasCycle = true;
            if (!visited.has(n) && !tempMark.has(n)) {
                tempMark.add(n);
                for (let m of (adj[n]||[])) visit(m);
                tempMark.delete(n);
                visited.add(n);
                topo.unshift(n);
            }
        };
        for (let n of allNodes) { if (!visited.has(n)) visit(n); }
        
        if (hasCycle) { alert("Error: El proyecto contiene ciclos circulares."); return []; }

        // CPM Calculation function
        const calcCPM = (currentNodes) => {
            // Forward pass
            for (let n of topo) {
                let node = currentNodes[n];
                if (revAdj[n].length === 0) {
                    node.ES = 0;
                } else {
                    node.ES = Math.max(...revAdj[n].map(p => currentNodes[p].EF));
                }
                node.EF = node.ES + node.duration;
            }
            
            // Backward pass
            let projectDuration = currentNodes['FIN'].EF;
            let revTopo = [...topo].reverse();
            for (let n of revTopo) {
                let node = currentNodes[n];
                if (adj[n].length === 0) {
                    node.LF = projectDuration;
                } else {
                    node.LF = Math.min(...adj[n].map(s => currentNodes[s].LS));
                }
                node.LS = node.LF - node.duration;
                node.slack = node.LS - node.ES;
                node.isCritical = node.slack === 0;
            }
            
            let criticalPath = topo.filter(n => currentNodes[n].isCritical && n !== 'INICIO' && n !== 'FIN');
            return { duration: projectDuration, nodes: currentNodes, criticalPath };
        };

        let iter = 1;
        let cpmState = calcCPM(nodes);
        let totalCost = this.activities.reduce((sum, a) => sum + (a.cn || 0), 0);

        // Record initial state
        this._recordStep(iter, "Estado Inicial del Proyecto", cpmState, totalCost);
        
        if (this.mode === 'crash') {
            // Pre-calculate limits and slopes
            for (let a of this.activities) {
                let n = nodes[a.id];
                n.maxReduction = Math.max(0, n.tn - n.ta);
                n.crashCostPerUnit = n.maxReduction > 0 ? (n.ca - n.cn) / n.maxReduction : Infinity;
                n.crashedSoFar = 0;
            }

            while (true) {
                iter++;
                // Find critical activities that can be crashed
                let candidates = cpmState.criticalPath.map(id => nodes[id])
                    .filter(n => n.crashedSoFar < n.maxReduction);
                
                if (candidates.length === 0) {
                    this._recordStep(iter, "**Fin de la compresión:** No hay más actividades en la ruta crítica que se puedan acelerar.", cpmState, totalCost);
                    break;
                }

                // Pick the one with min K_i
                candidates.sort((a, b) => a.crashCostPerUnit - b.crashCostPerUnit);
                let target = candidates[0];

                // Crash by 1 unit
                target.duration -= 1;
                target.crashedSoFar += 1;
                totalCost += target.crashCostPerUnit;

                // Recalculate CPM
                let newState = calcCPM(nodes);

                let desc = `**Iteración de Compresión ${iter-1}**\n`;
                desc += `Se aceleró la actividad **${target.id}** en 1 unidad.\n`;
                desc += `Costo marginal: $${target.crashCostPerUnit.toFixed(2)}\n`;
                desc += `Nueva duración del proyecto: **${newState.duration}**\n`;
                desc += `Nuevo costo total: **$${totalCost.toFixed(2)}**\n`;
                desc += `Nueva Ruta Crítica: ${newState.criticalPath.join(' → ')}`;

                this._recordStep(iter, desc, newState, totalCost);
                cpmState = newState;
            }
        }

        return { steps: this.steps, graphs: this.graphHistory, adj, revAdj };
    }

    _recordStep(iter, titleDesc, state, totalCost) {
        let nodeData = JSON.parse(JSON.stringify(state.nodes));
        
        let htmlTable = `<table><tr><th>Act</th><th>Dur</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Holgura</th><th>Crítica?</th></tr>`;
        for (let id in nodeData) {
            if (id === 'INICIO' || id === 'FIN') continue;
            let n = nodeData[id];
            htmlTable += `<tr style="${n.isCritical ? 'background:rgba(255,69,58,0.1)' : ''}">
                <td><strong>${id}</strong></td><td>${n.duration}</td>
                <td>${n.ES}</td><td>${n.EF}</td><td>${n.LS}</td><td>${n.LF}</td>
                <td>${n.slack}</td><td>${n.isCritical ? 'Sí' : 'No'}</td>
            </tr>`;
        }
        htmlTable += `</table>`;
        htmlTable += `<br><strong>Duración del Proyecto:</strong> ${state.duration} unidades de tiempo.<br>`;
        htmlTable += `<strong>Costo Total:</strong> $${totalCost.toFixed(2)}<br>`;
        htmlTable += `<strong>Ruta Crítica:</strong> ${state.criticalPath.join(' → ')}`;

        this.steps.push({
            iteration: iter,
            description: titleDesc,
            tableHTML: htmlTable
        });
        
        this.graphHistory.push({ nodes: nodeData, criticalPath: state.criticalPath });
    }
}

// ═══ APP STATE ═══
let activities = [];
let solverResult = null;
let currentStepIndex = 0;
let isFullLogMode = false;
let isDarkTheme = true;
let network = null;

document.addEventListener('DOMContentLoaded', () => {
    setupEvents();
    renderTable();
});

function setupEvents() {
    document.getElementById('btn-add-act').addEventListener('click', addActivity);
    document.getElementById('btn-clear').addEventListener('click', clearAll);
    document.getElementById('btn-example').addEventListener('click', loadExampleSimple);
    document.getElementById('btn-example-cost').addEventListener('click', loadExampleCost);
    document.getElementById('btn-save').addEventListener('click', () => {
        let b=new Blob([JSON.stringify(activities,null,2)],{type:'application/json'});
        let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`cpm_${Date.now()}.json`;document.body.appendChild(a);a.click();URL.revokeObjectURL(u);
    });
    document.getElementById('btn-load').addEventListener('click',()=>document.getElementById('file-load').click());
    document.getElementById('file-load').addEventListener('change',e=>{
        let f=e.target.files[0];if(!f)return;let r=new FileReader();
        r.onload=ev=>{try{activities=JSON.parse(ev.target.result);renderTable();}catch(err){alert("Error al cargar.");}document.getElementById('file-load').value='';};
        r.readAsText(f);
    });
    document.getElementById('btn-solve').addEventListener('click', solveProblem);
    document.getElementById('btn-back-edit').addEventListener('click', backToEdit);
    document.getElementById('btn-prev-step').addEventListener('click', ()=>changeStep(-1));
    document.getElementById('btn-next-step').addEventListener('click', ()=>changeStep(1));
    document.getElementById('btn-theme').addEventListener('click', toggleTheme);
    setupFullLog();
}

function addActivity() {
    let id = document.getElementById('act-id').value.trim().toUpperCase();
    let desc = document.getElementById('act-desc').value.trim();
    let predRaw = document.getElementById('act-pred').value.toUpperCase();
    let tn = parseFloat(document.getElementById('act-tn').value) || 0;
    let ta = parseFloat(document.getElementById('act-ta').value) || tn;
    let cn = parseFloat(document.getElementById('act-cn').value) || 0;
    let ca = parseFloat(document.getElementById('act-ca').value) || cn;

    if (!id) { alert("ID de actividad es obligatorio."); return; }
    if (activities.find(a => a.id === id)) { alert("Actividad ya existe."); return; }

    let pred = predRaw.split(',').map(s => s.trim()).filter(s => s !== '');
    
    activities.push({ id, desc, pred, tn, ta, cn, ca });
    
    document.getElementById('act-id').value = '';
    document.getElementById('act-desc').value = '';
    document.getElementById('act-pred').value = '';
    document.getElementById('act-tn').value = '';
    document.getElementById('act-ta').value = '';
    document.getElementById('act-cn').value = '';
    document.getElementById('act-ca').value = '';
    
    renderTable();
}

function removeActivity(id) {
    activities = activities.filter(a => a.id !== id);
    renderTable();
}

function renderTable() {
    let tb = document.querySelector('#data-table tbody');
    tb.innerHTML = '';
    activities.forEach(a => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${a.id}</strong></td>
            <td>${a.desc}</td>
            <td>${a.pred.join(', ')}</td>
            <td>${a.tn}</td>
            <td>${a.ta}</td>
            <td>$${a.cn}</td>
            <td>$${a.ca}</td>
            <td><button class="danger" onclick="removeActivity('${a.id}')">✕</button></td>
        `;
        tb.appendChild(tr);
    });
}

function clearAll() {
    activities = [];
    renderTable();
    if(network) network.destroy();
    document.getElementById('solver-panel').style.display='none';
    document.getElementById('data-entry-panel').style.display='block';
}

function loadExampleSimple() {
    activities = [
        {id:'A', desc:'Planos', pred:[], tn:5, ta:5, cn:0, ca:0},
        {id:'B', desc:'Arrendatarios', pred:[], tn:6, ta:6, cn:0, ca:0},
        {id:'C', desc:'Prospectos', pred:['A'], tn:4, ta:4, cn:0, ca:0},
        {id:'D', desc:'Contratista', pred:['A'], tn:3, ta:3, cn:0, ca:0},
        {id:'E', desc:'Permisos', pred:['A'], tn:1, ta:1, cn:0, ca:0},
        {id:'F', desc:'Aprobación', pred:['E'], tn:4, ta:4, cn:0, ca:0},
        {id:'G', desc:'Construcción', pred:['D','F'], tn:14, ta:14, cn:0, ca:0},
        {id:'H', desc:'Contratos', pred:['B','C'], tn:12, ta:12, cn:0, ca:0},
        {id:'I', desc:'Mudanza', pred:['G','H'], tn:2, ta:2, cn:0, ca:0}
    ];
    document.getElementById('solve-mode').value = 'cpm';
    renderTable();
}

function loadExampleCost() {
    activities = [
        {id:'A', desc:'Actividad A', pred:[], tn:7, ta:4, cn:500, ca:800},
        {id:'B', desc:'Actividad B', pred:[], tn:3, ta:2, cn:200, ca:350},
        {id:'C', desc:'Actividad C', pred:[], tn:6, ta:4, cn:500, ca:900},
        {id:'D', desc:'Actividad D', pred:['A'], tn:3, ta:1, cn:200, ca:500},
        {id:'E', desc:'Actividad E', pred:['B','C'], tn:2, ta:1, cn:300, ca:550}
    ];
    document.getElementById('solve-mode').value = 'crash';
    renderTable();
}

function solveProblem() {
    if (activities.length === 0) { alert("Agregue al menos una actividad."); return; }
    
    let mode = document.getElementById('solve-mode').value;
    let solver = new CPMSolver(activities, mode);
    solverResult = solver.solve();
    
    if (!solverResult || solverResult.steps.length === 0) return;
    
    currentStepIndex = 0;
    document.getElementById('data-entry-panel').style.display = 'none';
    document.getElementById('solver-panel').style.display = 'block';
    
    renderStep();
}

function changeStep(d) {
    currentStepIndex += d;
    if(currentStepIndex < 0) currentStepIndex = 0;
    if(currentStepIndex >= solverResult.steps.length) currentStepIndex = solverResult.steps.length - 1;
    renderStep();
}

function renderStep() {
    let s = solverResult.steps[currentStepIndex];
    document.getElementById('btn-prev-step').disabled = currentStepIndex === 0;
    document.getElementById('btn-next-step').disabled = currentStepIndex === solverResult.steps.length - 1;
    document.getElementById('step-info').innerText = `Paso ${currentStepIndex + 1} de ${solverResult.steps.length}`;
    
    let h = s.description.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    if (s.tableHTML) h += "<br>" + s.tableHTML;
    document.getElementById('step-description').innerHTML = h;
    
    drawGraph(solverResult.graphs[currentStepIndex], solverResult.adj);
}

function drawGraph(graphState, adj) {
    let nodes = new vis.DataSet();
    let edges = new vis.DataSet();
    let nodeData = graphState.nodes;

    // Use hierarchical layout for AON graph
    let nodeIds = Object.keys(nodeData);
    
    nodeIds.forEach(id => {
        let n = nodeData[id];
        let isCrit = n.isCritical;
        
        let bg = isDarkTheme ? (isCrit ? '#3f0f0f' : '#2d2d2d') : (isCrit ? '#ffe5e5' : '#f8f9fa');
        let border = isCrit ? '#ff453a' : (isDarkTheme ? '#3b82f6' : '#3498db');
        let txt = isDarkTheme ? '#e0e0e0' : '#333';
        
        if (id === 'INICIO' || id === 'FIN') {
            nodes.add({
                id: id,
                label: id,
                shape: 'ellipse',
                color: { background: bg, border: border },
                font: { color: txt }
            });
        } else {
            // SVG Node representation for AON (ES, EF, ID, LS, LF)
            let svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" style="background-color:${bg}; border: 2px solid ${border}; border-radius: 8px;">
                <rect width="120" height="20" fill="${isCrit ? (isDarkTheme ? '#7f1d1d' : '#ffcccc') : (isDarkTheme ? '#1e3a8a' : '#cce5ff')}" />
                <text x="60" y="14" font-family="sans-serif" font-size="14" font-weight="bold" fill="${txt}" text-anchor="middle">${id} (d=${n.duration})</text>
                
                <text x="5" y="35" font-family="sans-serif" font-size="12" fill="${txt}">ES: ${n.ES}</text>
                <text x="115" y="35" font-family="sans-serif" font-size="12" fill="${txt}" text-anchor="end">EF: ${n.EF}</text>
                
                <line x1="0" y1="40" x2="120" y2="40" stroke="${isDarkTheme ? '#555' : '#ccc'}" stroke-width="1"/>
                
                <text x="5" y="55" font-family="sans-serif" font-size="12" fill="${txt}">LS: ${n.LS}</text>
                <text x="115" y="55" font-family="sans-serif" font-size="12" fill="${txt}" text-anchor="end">LF: ${n.LF}</text>
            </svg>`;
            
            let url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
            
            nodes.add({
                id: id,
                shape: 'image',
                image: url,
                size: 40
            });
        }
    });

    for (let u in adj) {
        for (let v of adj[u]) {
            let isCritEdge = nodeData[u].isCritical && nodeData[v].isCritical && (nodeData[u].EF === nodeData[v].ES || u === 'INICIO' || v === 'FIN');
            edges.add({
                from: u,
                to: v,
                arrows: 'to',
                color: { color: isCritEdge ? '#ff453a' : (isDarkTheme ? '#9ca3af' : '#7f8c8d') },
                width: isCritEdge ? 3 : 1
            });
        }
    }

    let container = document.getElementById('graph-container');
    let options = {
        layout: {
            hierarchical: {
                direction: 'LR',
                sortMethod: 'directed',
                levelSeparation: 180,
                nodeSpacing: 100
            }
        },
        physics: { enabled: false },
        interaction: { dragNodes: true, hover: true }
    };
    
    if(network) network.destroy();
    network = new vis.Network(container, { nodes, edges }, options);
}

function backToEdit() {
    document.getElementById('solver-panel').style.display='none';
    document.getElementById('data-entry-panel').style.display='block';
    document.getElementById('main-flex').classList.remove('full-log-mode');
    isFullLogMode=false;
    document.getElementById('btn-full-log').innerHTML='Ver Todo 📄';
}

function setupFullLog(){
    let btn=document.getElementById('btn-full-log');
    btn.addEventListener('click',()=>{
        isFullLogMode=!isFullLogMode;
        if(isFullLogMode){
            document.getElementById('main-flex').classList.add('full-log-mode');
            btn.innerHTML='Volver al Paso a Paso 🔄';
            let h="";
            solverResult.steps.forEach((s,i)=>{
                h+=`<h4 style="margin-top:15px;margin-bottom:10px;color:var(--accent)">Paso ${i+1}</h4>`;
                h+=s.description.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
                if(s.tableHTML) h+="<br>"+s.tableHTML;
                h+="<hr style='margin-top:15px;border:0;border-top:1px solid var(--border)'>";
            });
            document.getElementById('step-description').innerHTML=h;
            document.getElementById('btn-prev-step').style.display='none';
            document.getElementById('btn-next-step').style.display='none';
            document.getElementById('step-info').innerText='Solución Completa';
            currentStepIndex = solverResult.steps.length - 1;
            drawGraph(solverResult.graphs[currentStepIndex], solverResult.adj);
        } else {
            document.getElementById('main-flex').classList.remove('full-log-mode');
            btn.innerHTML='Ver Todo 📄';
            document.getElementById('btn-prev-step').style.display='inline-block';
            document.getElementById('btn-next-step').style.display='inline-block';
            currentStepIndex=0;
            renderStep();
        }
    });
}

function toggleTheme(){
    isDarkTheme=!isDarkTheme;let btn=document.getElementById('btn-theme');
    if(isDarkTheme){document.documentElement.removeAttribute('data-theme');btn.innerHTML='☀︎ Modo Claro';}else{document.documentElement.setAttribute('data-theme','light');btn.innerHTML='🌙 Modo Oscuro';}
    if (solverResult && solverResult.graphs) {
        drawGraph(solverResult.graphs[currentStepIndex], solverResult.adj);
    }
}
</script>
