<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Gran M - Completa (Fracciones y Álgebra)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:            #000000;
            --surface:       #1c1c1e;
            --surface-2:     #252528;
            --surface-3:     #3a3a3c;
            --border:        rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.16);
            --text:          rgba(255,255,255,0.92);
            --text-2:        rgba(255,255,255,0.52);
            --text-3:        rgba(255,255,255,0.28);
            --accent:        #0a84ff;
            --accent-hover:  #409cff;
            --green:         #30d158;
            --red:           #ff453a;
            --pivot-col:     #bae6fd;
            --pivot-row:     #7dd3fc;
            --pivot-cell:    #0ea5e9;
            --pivot-text:    #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 2rem 1.5rem;
            display: flex; justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container { width: 100%; max-width: 1000px; }

        .nav-back {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); font-size: 0.82rem; font-weight: 500;
            text-decoration: none; padding: 0.4rem 0.85rem; border-radius: 999px;
            background: rgba(10,132,255,0.1); border: 1px solid rgba(10,132,255,0.18);
            transition: background 0.18s; margin-bottom: 1.75rem;
        }
        .nav-back:hover { background: rgba(10,132,255,0.18); }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; color: var(--accent); margin-bottom: 0.3rem; }
        .header p { color: var(--text-2); font-size: 0.85rem; }

        .card {
            background: var(--surface); border-radius: 16px; padding: 1.5rem;
            margin-bottom: 1.25rem; border: 1px solid var(--border);
        }
        h2 {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--text-3); margin-top: 0; margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;
        }

        .form-group, .restriction-row {
            display: flex; align-items: center; gap: 0.65rem;
            margin-bottom: 0.85rem; flex-wrap: wrap; row-gap: 0.5rem;
            font-size: 0.88rem; color: var(--text-2);
        }

        select, input {
            padding: 0.55rem 0.75rem; border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface-2); color: var(--text); font-size: 0.88rem;
            font-family: inherit; outline: none; min-height: 40px;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.2); }
        input[type="number"] { width: 75px; text-align: center; }

        .btn {
            background: var(--accent); color: #fff; border: none; padding: 0.55rem 1.1rem;
            border-radius: 8px; font-weight: 600; font-size: 0.82rem; font-family: inherit;
            cursor: pointer; transition: background 0.18s, transform 0.15s; min-height: 40px;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--accent); border: 1px solid rgba(10,132,255,0.35); }
        .btn-outline:hover { background: rgba(10,132,255,0.1); transform: none; }
        .btn-danger { background: var(--red); padding: 0.4rem 0.75rem; font-size: 0.78rem; min-height: 36px; }
        .btn-danger:hover { background: #e03030; }

        .table-container {
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            margin-bottom: 1.5rem; border-radius: 10px; border: 1px solid var(--border);
            display: block; width: 100%;
        }
        table {
            width: 100%; border-collapse: collapse; font-size: 0.84rem;
            background: var(--surface); white-space: nowrap;
        }
        th, td {
            padding: 0.6rem 0.85rem; text-align: center;
            border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
        }
        th { background: var(--surface-2); font-weight: 600; color: var(--text-2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
        td { color: var(--text); }
        tr:last-child td { border-bottom: none; }
        td:last-child, th:last-child { border-right: none; }
        .row-z { background: var(--surface-2); font-weight: 600; }

        /* Pivot — celeste */
        th.col-pivot, td.col-pivot { background: var(--pivot-col) !important; color: var(--pivot-text) !important; }
        tr.row-pivot               { background: var(--pivot-row) !important; }
        tr.row-pivot > td          { color: var(--pivot-text) !important; background: var(--pivot-row) !important; }
        td.cell-pivot {
            background: var(--pivot-cell) !important; color: var(--pivot-text) !important;
            font-weight: 700 !important; border: 2px solid #0284c7 !important;
        }

        .badge {
            display: inline-block; background: rgba(10,132,255,0.15); color: var(--accent);
            padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
            margin-bottom: 0.75rem; border: 1px solid rgba(10,132,255,0.25);
        }
        .summary-box {
            background: rgba(48,209,88,0.07); border: 1px solid rgba(48,209,88,0.2);
            padding: 1.4rem; border-radius: 12px; margin-top: 1rem;
        }
        .summary-box h3 { margin-top: 0; color: var(--green); font-size: 0.88rem; font-weight: 600; margin-bottom: 0.75rem; }
        .summary-box p, .summary-box li { font-size: 0.85rem; color: rgba(255,255,255,0.78); line-height: 1.7; }
        .summary-box ul { padding-left: 1.2rem; }

        .function-box {
            background: rgba(10,132,255,0.07); border-left: 3px solid var(--accent);
            padding: 1.1rem 1.2rem; border-radius: 0 10px 10px 0; margin-bottom: 1rem;
            color: var(--text); font-size: 0.9rem;
        }
        .function-box.alt { background: var(--surface-2); border-left-color: var(--border-strong); }
        .function-box code {
            font-family: ui-monospace, 'Menlo', monospace; font-size: 0.88rem;
            color: var(--text); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
        }
        .function-box strong { color: var(--text-2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

        #results { display: none; }

        /* Mobile stepper */
        .mobile-stepper {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 10px; padding: 0.2rem;
        }
        .mobile-stepper > input[type="number"] {
            margin: 0; border: none; background: transparent;
            min-width: 62px; width: 62px; text-align: center; box-shadow: none;
        }
        .mobile-stepper > input[type="number"]:focus { box-shadow: none; border: none; }
        .step-btn {
            border: none; min-width: 38px; min-height: 38px; border-radius: 8px;
            font-weight: 700; font-size: 0.85rem; color: var(--text-2);
            background: var(--surface-3); cursor: pointer; touch-action: manipulation;
            transition: background 0.15s, color 0.15s;
        }
        .step-btn:hover { background: var(--border-strong); color: var(--text); transform: none; }

        @media (max-width: 1024px) { input[type="number"] { width: 65px; } table { font-size: 0.8rem; } th, td { padding: 0.5rem; } }
        @media (max-width: 768px) {
            body { padding: 1.5rem 1rem; }
            .mobile-stepper { width: 100%; justify-content: space-between; }
            .mobile-stepper > input[type="number"] { flex: 1; width: auto; min-width: 0; }
            table { font-size: 0.75rem; } th, td { padding: 0.4rem 0.5rem; }
        }
        @media (max-width: 480px) {
            body { padding: 1rem 0.75rem; }
            .card { padding: 1.1rem; border-radius: 12px; }
            .form-group, .restriction-row { flex-direction: column; gap: 0.4rem; width: 100%; }
            input[type="number"], select { width: 100%; }
            .btn { width: 100%; }
            table { font-size: 0.62rem; } th, td { padding: 0.28rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 0.5rem;">
        <a href="index.html" class="nav-back">← Volver al Inicio</a>
    </div>
    <div class="header">
        <h1>Método de la Gran M</h1>
        <p>Álgebra, Penalizaciones y Fracciones Exactas</p>
    </div>

    <div class="card">
        <h2>1. Función Objetivo</h2>
        <div class="form-group">
            <select id="optType">
                <option value="max">Maximizar (Z)</option>
                <option value="min" selected>Minimizar (Z)</option>
            </select>
            <span> = </span>
            <input type="number" id="zX1" value="0.6" step="any"> <span>X₁</span>
            <span> + </span>
            <input type="number" id="zX2" value="1" step="any"> <span>X₂</span>
        </div>

        <h2>2. Restricciones</h2>
        <div id="restrictions-container">
            <div class="restriction-row" id="row-1">
                <input type="number" class="r-x1" value="10" step="any"> <span>X₁</span> +
                <input type="number" class="r-x2" value="4" step="any"> <span>X₂</span>
                <select class="r-op"><option value="<=">&le;</option><option value="=">=</option><option value=">=" selected>&ge;</option></select>
                <input type="number" class="r-rhs" value="20" step="any">
                <button class="btn btn-danger" onclick="removeRestriction(1)">✕</button>
            </div>
            <div class="restriction-row" id="row-2">
                <input type="number" class="r-x1" value="5" step="any"> <span>X₁</span> +
                <input type="number" class="r-x2" value="5" step="any"> <span>X₂</span>
                <select class="r-op"><option value="<=">&le;</option><option value="=">=</option><option value=">=" selected>&ge;</option></select>
                <input type="number" class="r-rhs" value="20" step="any">
                <button class="btn btn-danger" onclick="removeRestriction(2)">✕</button>
            </div>
            <div class="restriction-row" id="row-3">
                <input type="number" class="r-x1" value="2" step="any"> <span>X₁</span> +
                <input type="number" class="r-x2" value="6" step="any"> <span>X₂</span>
                <select class="r-op"><option value="<=">&le;</option><option value="=">=</option><option value=">=" selected>&ge;</option></select>
                <input type="number" class="r-rhs" value="12" step="any">
                <button class="btn btn-danger" onclick="removeRestriction(3)">✕</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 1.5rem; gap: 0.75rem; flex-wrap: wrap;">
            <button class="btn btn-outline" onclick="addRestriction()">+ Añadir Restricción</button>
            <button class="btn" onclick="solve()">Resolver Exactamente</button>
        </div>
    </div>

    <div id="results" class="card">
        <h2>3. Resolución Paso a Paso</h2>
        <div id="tables-output"></div>
    </div>
</div>

<script>
    let restrictionCount = 3;

    function addRestriction() {
        restrictionCount++;
        const container = document.getElementById('restrictions-container');
        const row = document.createElement('div');
        row.className = 'restriction-row';
        row.id = `row-${restrictionCount}`;
        row.innerHTML = `
            <input type="number" class="r-x1" value="1" step="any"> <span>X₁</span> +
            <input type="number" class="r-x2" value="1" step="any"> <span>X₂</span>
            <select class="r-op">
                <option value="<=">&le;</option>
                <option value="=">=</option>
                <option value=">=">&ge;</option>
            </select>
            <input type="number" class="r-rhs" value="10" step="any">
            <button class="btn btn-danger" onclick="removeRestriction(${restrictionCount})">✕</button>
        `;
        container.appendChild(row);
        enhanceNumberInputs(row);
    }

    function removeRestriction(id) { document.getElementById(`row-${id}`).remove(); }

    function enhanceNumberInputs(root = document) {
        const inputs = root.querySelectorAll('input[type="number"]');
        inputs.forEach((input) => {
            if (input.dataset.stepper === 'on') return;
            if (input.closest('.mobile-stepper')) { input.dataset.stepper = 'on'; return; }
            const wrapper = document.createElement('div');
            wrapper.className = 'mobile-stepper';
            const minusBtn = document.createElement('button');
            minusBtn.type = 'button'; minusBtn.className = 'step-btn'; minusBtn.textContent = '-1';
            const plusBtn = document.createElement('button');
            plusBtn.type = 'button'; plusBtn.className = 'step-btn'; plusBtn.textContent = '+1';
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(minusBtn); wrapper.appendChild(input); wrapper.appendChild(plusBtn);
            input.dataset.stepper = 'on';
            minusBtn.addEventListener('click', () => nudgeInput(input, -1));
            plusBtn.addEventListener('click', () => nudgeInput(input, 1));
        });
    }

    function nudgeInput(input, delta) {
        const current = parseFloat(input.value || '0');
        const min = input.min !== '' ? parseFloat(input.min) : null;
        const max = input.max !== '' ? parseFloat(input.max) : null;
        let next = current + delta;
        if (min !== null && next < min) next = min;
        if (max !== null && next > max) next = max;
        input.value = Number.isInteger(next) ? String(next) : next.toString();
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    document.addEventListener('DOMContentLoaded', () => { enhanceNumberInputs(document); });

    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : gcd(b, a % b); }

    class Fraction {
        constructor(n, d = 1) {
            if (d === 0) throw "Div by zero";
            let sign = (n < 0) ^ (d < 0) ? -1 : 1;
            n = Math.abs(n); d = Math.abs(d);
            let divisor = gcd(n, d);
            this.n = sign * (n / divisor);
            this.d = d / divisor;
        }

        static fromNumber(val) {
            if (typeof val === 'string') val = parseFloat(val);
            if (Number.isInteger(val)) return new Fraction(val, 1);
            let sign = val < 0 ? -1 : 1;
            val = Math.abs(val);
            let len = (val.toString().split('.')[1] || '').length;
            if(len > 6) len = 6;
            let den = Math.pow(10, len);
            let num = Math.round(val * den);
            return new Fraction(sign * num, den);
        }

        add(f) { return new Fraction(this.n * f.d + f.n * this.d, this.d * f.d); }
        sub(f) { return new Fraction(this.n * f.d - f.n * this.d, this.d * f.d); }
        mul(f) { return new Fraction(this.n * f.n, this.d * f.d); }
        div(f) { return new Fraction(this.n * f.d, this.d * f.n); }
        val() { return this.n / this.d; }

        toString() {
            if (this.n === 0) return "0";
            if (this.d === 1) return this.n.toString();
            return `${this.n}/${this.d}`;
        }
    }

    class CNum {
        constructor(cFrac, mFrac) {
            this.c = cFrac || new Fraction(0);
            this.m = mFrac || new Fraction(0);
        }
        add(o) { return new CNum(this.c.add(o.c), this.m.add(o.m)); }
        sub(o) { return new CNum(this.c.sub(o.c), this.m.sub(o.m)); }
        mul(f) { return new CNum(this.c.mul(f), this.m.mul(f)); }
        div(f) { return new CNum(this.c.div(f), this.m.div(f)); }

        isNegative() {
            let mVal = this.m.val(), cVal = this.c.val();
            return mVal < -1e-6 || (Math.abs(mVal) < 1e-6 && cVal < -1e-6);
        }
        isLessThan(o) {
            let mDiff = this.m.val() - o.m.val();
            if (Math.abs(mDiff) > 1e-6) return mDiff < 0;
            return this.c.val() < o.c.val() - 1e-6;
        }

        format() {
            let cStr = this.c.toString(), mStr = this.m.toString();
            if (mStr === "0") return cStr;
            let mPart = (mStr === "1" ? "M" : (mStr === "-1" ? "-M" : mStr + "M"));
            if (cStr === "0") return mPart;
            if (this.m.val() > 0) return `${cStr} + ${mPart}`;
            mPart = mPart.replace("-", "");
            return `${cStr} - ${mPart}`;
        }
    }

    function formatTerm(coefFrac, variable, isFirst) {
        let val = coefFrac.val();
        if (val === 0) return '';
        let sign = val > 0 ? '+' : '-';
        let absFrac = new Fraction(Math.abs(coefFrac.n), coefFrac.d);
        let coefStr = absFrac.val() === 1 ? '' : absFrac.toString();
        let str = `${coefStr}${variable}`;
        if (isFirst) return val < 0 ? `-${str}` : str;
        return ` ${sign} ${str}`;
    }

    function solve() {
        document.getElementById('results').style.display = 'block';
        const output = document.getElementById('tables-output');
        output.innerHTML = '';

        const isMin = document.getElementById('optType').value === 'min';
        let z1 = Fraction.fromNumber(document.getElementById('zX1').value || 0);
        let z2 = Fraction.fromNumber(document.getElementById('zX2').value || 0);

        const rows = document.querySelectorAll('.restriction-row');
        let data = [];
        let sCountTotal = 0, eCountTotal = 0, aCountTotal = 0;

        rows.forEach(r => {
            let x1 = parseFloat(r.querySelector('.r-x1').value) || 0;
            let x2 = parseFloat(r.querySelector('.r-x2').value) || 0;
            let op = r.querySelector('.r-op').value;
            let rhs = parseFloat(r.querySelector('.r-rhs').value) || 0;

            if (rhs < 0) { x1 = -x1; x2 = -x2; rhs = -rhs; op = (op === '<=') ? '>=' : (op === '>=') ? '<=' : '='; }
            if (op === '<=') sCountTotal++;
            else if (op === '>=') { eCountTotal++; aCountTotal++; }
            else if (op === '=') aCountTotal++;
            data.push({x1, x2, op, rhs});
        });

        let targetZ = isMin ? '-Z' : 'Z';
        let c1_max = isMin ? new Fraction(-z1.n, z1.d) : z1;
        let c2_max = isMin ? new Fraction(-z2.n, z2.d) : z2;

        let eqLines = [];
        let zEq = `0: <code>${targetZ}`;
        zEq += formatTerm(c1_max, 'X₁', false);
        zEq += formatTerm(c2_max, 'X₂', false);
        for(let i=1; i<=sCountTotal; i++) zEq += ` + 0S${i}`;
        for(let i=1; i<=eCountTotal; i++) zEq += ` + 0E${i}`;
        for(let i=1; i<=aCountTotal; i++) zEq += ` + MA${i}`;
        zEq += ` = 0</code>`;
        eqLines.push(zEq);

        let currS = 1, currE = 1, currA = 1;
        data.forEach((d, idx) => {
            let eq = `${idx + 1}: <code>`;
            eq += formatTerm(Fraction.fromNumber(d.x1), 'X₁', true);
            eq += formatTerm(Fraction.fromNumber(d.x2), 'X₂', false);
            if (d.op === '<=') { eq += ` + S${currS}`; currS++; }
            else if (d.op === '>=') { eq += ` - E${currE} + A${currA}`; currE++; currA++; }
            else if (d.op === '=') { eq += ` + A${currA}`; currA++; }
            eq += ` = ${Fraction.fromNumber(d.rhs).toString()}</code>`;
            eqLines.push(eq);
        });

        let eqZ = `Max(${targetZ}) = `;
        eqZ += formatTerm(c1_max, 'X₁', true);
        eqZ += formatTerm(c2_max, 'X₂', false);
        for(let i=1; i<=aCountTotal; i++) eqZ += ` - MA${i}`;

        let eqZero = `${targetZ} `;
        eqZero += formatTerm(new Fraction(-c1_max.n, c1_max.d), 'X₁', false);
        eqZero += formatTerm(new Fraction(-c2_max.n, c2_max.d), 'X₂', false);
        for(let i=1; i<=aCountTotal; i++) eqZero += ` + MA${i}`;
        eqZero += ` = 0`;

        output.innerHTML += `
            <div class="function-box">
                <strong>Forma Algebraica (Aumentada):</strong><br><br>
                ${eqLines.join('<br>')}
            </div>
            <div class="function-box alt">
                <strong>Función a Maximizar (Penalizada):</strong><br>
                <code>${eqZ}</code><br><br>
                <strong>Fila Z igualada a cero (para la matriz):</strong><br>
                <code>${eqZero}</code>
            </div>
        `;

        let headers = ['X1', 'X2'];
        let basis = [];
        sCountTotal = 0; eCountTotal = 0; aCountTotal = 0;
        let matrixRows = [];

        data.forEach((d, i) => {
            if (d.op === '<=') { sCountTotal++; headers.push(`S${sCountTotal}`); basis.push(`S${sCountTotal}`); }
            else if (d.op === '>=') { eCountTotal++; aCountTotal++; headers.push(`E${eCountTotal}`, `A${aCountTotal}`); basis.push(`A${aCountTotal}`); }
            else if (d.op === '=') { aCountTotal++; headers.push(`A${aCountTotal}`); basis.push(`A${aCountTotal}`); }
        });
        headers.push('RHS');
        const numCols = headers.length;

        let zRow = new Array(numCols).fill(null).map(() => new CNum());
        zRow[0] = new CNum(isMin ? z1 : new Fraction(-z1.n, z1.d));
        zRow[1] = new CNum(isMin ? z2 : new Fraction(-z2.n, z2.d));
        headers.forEach((h, j) => { if (h.startsWith('A')) zRow[j] = new CNum(new Fraction(0), new Fraction(1)); });
        matrixRows.push(zRow);

        currS = 1; currE = 1; currA = 1;
        data.forEach(d => {
            let row = new Array(numCols).fill(null).map(() => new CNum());
            row[0] = new CNum(Fraction.fromNumber(d.x1));
            row[1] = new CNum(Fraction.fromNumber(d.x2));
            row[numCols - 1] = new CNum(Fraction.fromNumber(d.rhs));
            if (d.op === '<=') { row[headers.indexOf(`S${currS}`)] = new CNum(new Fraction(1)); currS++; }
            else if (d.op === '>=') { row[headers.indexOf(`E${currE}`)] = new CNum(new Fraction(-1)); row[headers.indexOf(`A${currA}`)] = new CNum(new Fraction(1)); currE++; currA++; }
            else if (d.op === '=') { row[headers.indexOf(`A${currA}`)] = new CNum(new Fraction(1)); currA++; }
            matrixRows.push(row);
        });

        for(let i = 1; i < matrixRows.length; i++) {
            if (basis[i-1].startsWith('A')) {
                for (let j = 0; j < numCols; j++) {
                    let valToSub = new CNum(new Fraction(0), matrixRows[i][j].c);
                    matrixRows[0][j] = matrixRows[0][j].sub(valToSub);
                }
            }
        }

        let iteration = 0;
        let isOptimal = false;

        while (!isOptimal && iteration < 15) {
            let enterCol = -1;
            let minVal = new CNum(new Fraction(0), new Fraction(0));
            for (let j = 0; j < numCols - 1; j++) {
                if (matrixRows[0][j].isNegative()) {
                    if (enterCol === -1 || matrixRows[0][j].isLessThan(minVal)) {
                        minVal = matrixRows[0][j]; enterCol = j;
                    }
                }
            }

            let leaveRow = -1, minRatio = Infinity;
            let thetas = new Array(matrixRows.length).fill('-');

            if (enterCol !== -1) {
                for (let i = 1; i < matrixRows.length; i++) {
                    let pivotFrac = matrixRows[i][enterCol].c;
                    if (pivotFrac.val() > 1e-6) {
                        let rhsFrac = matrixRows[i][numCols - 1].c;
                        let ratioFrac = rhsFrac.div(pivotFrac);
                        let ratioVal = ratioFrac.val();
                        thetas[i] = ratioFrac.d === 1 ? ratioFrac.toString() : `${ratioFrac.toString()} (${ratioVal.toFixed(2)})`;
                        if (ratioVal < minRatio) { minRatio = ratioVal; leaveRow = i; }
                    }
                }
            } else {
                isOptimal = true;
            }

            renderTable(output, iteration, headers, basis, matrixRows, thetas, enterCol, leaveRow, targetZ);

            if (isOptimal) break;
            if (leaveRow === -1) { output.innerHTML += `<div class="summary-box">Solución NO ACOTADA.</div>`; break; }

            let pivot = matrixRows[leaveRow][enterCol].c;
            for (let j = 0; j < numCols; j++) { matrixRows[leaveRow][j] = matrixRows[leaveRow][j].div(pivot); }

            for (let i = 0; i < matrixRows.length; i++) {
                if (i !== leaveRow) {
                    let factor = matrixRows[i][enterCol];
                    for (let j = 0; j < numCols; j++) {
                        matrixRows[i][j] = matrixRows[i][j].sub(factor.mul(matrixRows[leaveRow][j].c));
                    }
                }
            }

            basis[leaveRow - 1] = headers[enterCol];
            iteration++;
        }

        if (isOptimal) {
            let zFrac = matrixRows[0][numCols - 1].c;
            if (isMin) zFrac = new Fraction(-zFrac.n, zFrac.d);
            let zStr = zFrac.d === 1 ? zFrac.toString() : `${zFrac.toString()} (${parseFloat(zFrac.val().toFixed(4))})`;

            let resultsHTML = `<div class="summary-box"><h3>✔ Solución Óptima Encontrada</h3>
                <p><strong>Z = ${zStr}</strong></p><ul>`;
            headers.slice(0, -1).forEach(h => {
                let idx = basis.indexOf(h);
                if(idx !== -1) {
                    let valFrac = matrixRows[idx + 1][numCols - 1].c;
                    let valStr = valFrac.d === 1 ? valFrac.toString() : `${valFrac.toString()} (${parseFloat(valFrac.val().toFixed(4))})`;
                    resultsHTML += `<li><strong>${h}</strong> = ${valStr}</li>`;
                } else if (h.startsWith('X')) {
                    resultsHTML += `<li><strong>${h}</strong> = 0</li>`;
                }
            });
            resultsHTML += `</ul></div>`;
            output.innerHTML += resultsHTML;
        }
    }

    function renderTable(container, iterNum, headers, basis, matrixRows, thetas, enterCol, leaveRow, targetZ) {
        let html = `<div><span class="badge">Iteración ${iterNum}</span></div><div class="table-container"><table>
            <thead><tr>
                <th>&vartheta;</th><th>Base</th><th>Z</th>
                ${headers.map((h, j) => `<th${j === enterCol ? ' class="col-pivot"' : ''}>${h}</th>`).join('')}
            </tr></thead><tbody>`;

        for (let i = 0; i < matrixRows.length; i++) {
            let isPivotRow = (i === leaveRow);
            let rowClass = i === 0 ? 'row-z' : (isPivotRow ? 'row-pivot' : '');

            html += `<tr class="${rowClass}">
                <td>${i === 0 ? '-' : thetas[i]}</td>
                <td><strong>${i === 0 ? targetZ : basis[i-1]}</strong></td>
                <td>${i === 0 ? '1' : '0'}</td>`;

            for (let j = 0; j < headers.length; j++) {
                let cellClass = (isPivotRow && j === enterCol) ? 'cell-pivot' : (j === enterCol ? 'col-pivot' : '');
                html += `<td class="${cellClass}">${matrixRows[i][j].format()}</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        if (enterCol !== -1 && leaveRow !== -1) {
            html += `<p style="font-size:0.8rem;color:var(--text-2);margin-bottom:1.5rem;padding:0 0.25rem;">
                ➡ Entra: <strong style="color:var(--accent)">${headers[enterCol]}</strong> &nbsp;|&nbsp;
                ⬅ Sale: <strong style="color:var(--accent)">${basis[leaveRow-1]}</strong> &nbsp;|&nbsp;
                Pivote: <strong style="color:var(--accent)">${matrixRows[leaveRow][enterCol].c.toString()}</strong>
            </p>`;
        }
        container.innerHTML += html;
    }
</script>
